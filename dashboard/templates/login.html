<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | AI IDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-gray-950 flex items-center justify-center min-h-screen text-white"><div class="bg-gray-900 p-8 rounded-2xl w-full max-w-md shadow-xl border border-gray-800"><h2 class="text-2xl font-bold mb-2 text-center">🔐 Secure Login</h2>
<p class="text-gray-400 text-sm text-center mb-6">
    Access your AI IDS/IPS Dashboard
</p>

<!-- Flash Messages from Flask -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="bg-red-500/20 text-red-400 p-3 rounded-lg text-sm mb-4 text-center">
          {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4" onsubmit="showLoader()">

    <!-- Username -->
    <input 
        type="text" 
        name="username"
        placeholder="Username"
        required
        autocomplete="username"
        class="w-full p-3 bg-gray-800 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">

    <!-- Password -->
    <div class="relative">
        <input 
            id="password"
            type="password" 
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
            class="w-full p-3 bg-gray-800 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">

        <!-- Toggle visibility -->
        <button type="button" onclick="togglePassword()" 
            class="absolute right-3 top-3 text-gray-400 text-sm">
            👁
        </button>
    </div>

    <!-- Submit Button -->
    <button id="loginBtn" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 transition p-3 rounded-lg font-bold flex justify-center items-center gap-2">

        <span id="btnText">Login</span>
        <span id="loader" class="hidden animate-spin border-2 border-white border-t-transparent rounded-full w-4 h-4"></span>

    </button>

</form>

<p class="text-xs text-gray-500 mt-6 text-center">
    AI IDS/IPS Secure Access System
</p>

</div><script>
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

function showLoader() {
    document.getElementById("btnText").innerText = "Logging in...";
    document.getElementById("loader").classList.remove("hidden");
}
</script></body>
</html>
