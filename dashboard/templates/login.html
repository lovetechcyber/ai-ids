<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 flex items-center justify-center h-screen">

<div class="bg-gray-900 p-8 rounded-xl w-96 shadow-lg">

    <h2 class="text-2xl font-bold mb-6 text-center">🔐 Secure Login</h2>

    <form method="POST" class="space-y-4">

        <input type="text" name="username"
            placeholder="Username"
            class="w-full p-3 bg-gray-800 rounded-lg outline-none">

        <input type="password" name="password"
            placeholder="Password"
            class="w-full p-3 bg-gray-800 rounded-lg outline-none">

        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg font-bold">
            Login
        </button>

    </form>

    <p class="text-xs text-gray-500 mt-4 text-center">
        AI IDS/IPS Secure Access System
    </p>

</div>

</body>
</html>
